<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomocord — Liquid Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(28, 30, 38, 0.48);
      --glass-sidebar: rgba(20, 22, 28, 0.56);
      --glass-elevated: rgba(42, 45, 58, 0.52);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --glass-active: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.13);
      --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.22);
      --text-main: #f5f5f7;
      --text-muted: rgba(235, 235, 245, 0.58);
      --apple-blue: #0a84ff;
      --apple-blue-glow: rgba(10, 132, 255, 0.35);
      --apple-green: #30d158;
      --apple-green-soft: rgba(48, 209, 88, 0.18);
      --apple-red: #ff453a;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #07080c;
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      padding: 12px;
      gap: 12px;
      user-select: none;
      position: relative;
    }

    /* Живой фоновый градиент (Liquid Orbs) для эффекта преломления стекла */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, #0d101b 0%, #050609 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, #0a84ff, #5e5ce6);
      top: -10%;
      left: -5%;
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #bf5af2, #ff375f);
      bottom: -12%;
      right: -4%;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #30d158, #0a84ff);
      top: 40%;
      left: 42%;
      opacity: 0.25;
      animation-delay: -12s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 35px) scale(0.95); }
    }

    /* Базовый класс Liquid Glass */
    .liquid-panel {
      position: relative;
      z-index: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(36px) saturate(185%);
      -webkit-backdrop-filter: blur(36px) saturate(185%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular), 0 20px 50px rgba(0, 0, 0, 0.45);
      border-radius: 26px;
      transition: transform 0.35s var(--spring), background 0.25s ease;
    }

    /* Плавные анимации элементов */
    @keyframes msgAppear {
      from { opacity: 0; transform: translateY(12px) scale(0.97); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes modalGlass {
      from { opacity: 0; transform: scale(0.9) translateY(14px); filter: blur(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(48, 209, 88, 0); }
      100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
    }

    /* Экран регистрации профиля */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 8, 12, 0.65);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.45s var(--spring), visibility 0.45s ease;
    }

    .auth-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-card {
      width: 100%;
      max-width: 390px;
      background: rgba(30, 32, 42, 0.62);
      backdrop-filter: blur(44px) saturate(200%);
      -webkit-backdrop-filter: blur(44px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 32px 80px rgba(0, 0, 0, 0.65);
      border-radius: 32px;
      padding: 32px;
      animation: modalGlass 0.45s var(--spring);
    }

    .auth-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 10px 24px var(--apple-blue-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 18px;
    }

    .glass-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      padding: 12px 15px;
      color: var(--text-main);
      font-size: 14px;
      margin-top: 6px;
      margin-bottom: 16px;
      outline: none;
      transition: all 0.25s var(--spring);
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.2);
    }

    .color-row {
      display: flex;
      gap: 12px;
      margin: 8px 0 22px;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.25s var(--bounce), border-color 0.2s;
    }

    .color-dot:hover { transform: scale(1.12); }

    .color-dot.selected {
      border-color: #fff;
      transform: scale(1.2);
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.25);
    }

    .btn-apple {
      width: 100%;
      background: linear-gradient(180deg, #1a8cff 0%, #0071e3 100%);
      color: #fff;
      border: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 20px var(--apple-blue-glow);
      border-radius: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s var(--spring), filter 0.2s ease;
    }

    .btn-apple:hover { filter: brightness(1.08); }
    .btn-apple:active { transform: scale(0.96); }

    .btn-glass-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s var(--spring);
    }

    .btn-glass-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-glass-secondary:active { transform: scale(0.97); }

    /* 1. Колонка серверов (Apple Dock style) */
    .servers-bar {
      width: 74px;
      background: var(--glass-sidebar);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 12px;
      overflow-y: auto;
    }

    .server-wrap {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .server-pill {
      position: absolute;
      left: 4px;
      width: 4px;
      height: 0;
      background: #fff;
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
      transition: height 0.3s var(--bounce);
    }

    .server-wrap:hover .server-pill { height: 18px; }
    .server-wrap.active .server-pill { height: 32px; }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--bounce);
    }

    .server-icon:hover {
      transform: scale(1.08) translateY(-1px);
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .server-wrap.active .server-icon {
      background: linear-gradient(135deg, #0a84ff, #5e5ce6);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 8px 20px var(--apple-blue-glow);
      color: #fff;
    }

    .server-icon:active { transform: scale(0.92); }

    .server-add {
      color: var(--apple-green);
      font-size: 22px;
      font-weight: 400;
    }

    .server-add:hover {
      background: var(--apple-green);
      color: #07080c;
      box-shadow: 0 8px 20px rgba(48, 209, 88, 0.35);
    }

    .divider {
      width: 30px;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    /* 2. Колонка каналов */
    .channels-bar {
      width: 256px;
      background: var(--glass-sidebar);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .server-header {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
      gap: 8px;
    }

    .code-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--apple-blue);
      padding: 5px 9px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s var(--spring);
      white-space: nowrap;
    }

    .code-pill:hover {
      background: rgba(10, 132, 255, 0.18);
      border-color: var(--apple-blue);
      transform: scale(1.03);
    }

    .code-pill:active { transform: scale(0.95); }

    .channels-list {
      padding: 12px 10px;
      flex: 1;
      overflow-y: auto;
    }

    .category-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 8px 10px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.22s var(--spring);
      margin-bottom: 3px;
      text-align: left;
    }

    .channel-btn:hover {
      background: var(--glass-hover);
      color: var(--text-main);
      transform: translateX(3px);
    }

    .channel-btn.active {
      background: var(--glass-active);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .channel-btn.voice-active {
      background: var(--apple-green-soft);
      border-color: rgba(48, 209, 88, 0.25);
      color: var(--apple-green);
    }

    .voice-user {
      padding: 5px 12px 7px 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-main);
      animation: msgAppear 0.25s var(--spring);
    }

    .mini-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      animation: pulseRing 2s infinite;
    }

    /* Нижняя капсула профиля + Саундпад */
    .user-panel {
      background: rgba(14, 15, 20, 0.45);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
    }

    .soundpad-bar {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: msgAppear 0.25s var(--spring);
    }

    .soundpad-bar.open { display: flex; }

    .soundpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .pad-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border-radius: 11px;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s var(--bounce);
      text-align: center;
    }

    .pad-btn:hover {
      background: rgba(10, 132, 255, 0.2);
      border-color: rgba(10, 132, 255, 0.45);
      transform: translateY(-1px);
    }

    .pad-btn:active {
      transform: scale(0.9);
      background: var(--apple-blue);
      color: #fff;
    }

    .voice-status {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
      align-items: center;
      justify-content: space-between;
      animation: msgAppear 0.25s var(--spring);
    }

    .voice-status.connected { display: flex; }

    .voice-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--apple-green);
    }

    .voice-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .profile-row {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--apple-blue);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      position: relative;
      flex-shrink: 0;
    }

    .status-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--apple-green);
      border: 2px solid #14161d;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--spring);
      font-size: 15px;
    }

    .icon-btn:hover {
      background: var(--glass-hover);
      color: #fff;
      transform: scale(1.06);
    }

    .icon-btn:active { transform: scale(0.92); }

    .icon-btn.active {
      background: rgba(10, 132, 255, 0.2);
      color: var(--apple-blue);
    }

    .icon-btn.danger { color: var(--apple-red); }

    /* 3. Окно чата */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .chat-header {
      height: 54px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
    }

    .call-btn {
      background: rgba(48, 209, 88, 0.16);
      color: var(--apple-green);
      border: 1px solid rgba(48, 209, 88, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--spring);
    }

    .call-btn:hover {
      background: var(--apple-green);
      color: #07080c;
      transform: scale(1.03);
    }

    .call-btn:active { transform: scale(0.95); }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: text;
    }

    .msg {
      display: flex;
      gap: 12px;
      padding: 8px 12px;
      margin: 0 -12px;
      border-radius: 16px;
      animation: msgAppear 0.28s var(--spring);
      transition: background 0.2s ease;
    }

    .msg:hover { background: rgba(255, 255, 255, 0.04); }

    .msg-author { font-weight: 600; font-size: 14px; }
    .msg-time { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-left: 6px; }
    .msg-text { font-size: 14px; line-height: 1.48; color: rgba(245, 245, 247, 0.9); margin-top: 3px; word-break: break-word; }

    .input-wrap { padding: 0 20px 20px; }

    .input-form {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(0, 0, 0, 0.2);
      border-radius: 18px;
      padding: 8px 10px 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s var(--spring);
    }

    .input-form:focus-within {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(10, 132, 255, 0.6);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.18), 0 10px 28px rgba(0, 0, 0, 0.25);
    }

    .input-form input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(180deg, #1a8cff 0%, #0071e3 100%);
      color: #fff;
      border: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s var(--spring), filter 0.2s;
    }

    .send-btn:hover { filter: brightness(1.08); }
    .send-btn:active { transform: scale(0.94); }

    /* Модалка Liquid Glass */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 380px;
      background: rgba(30, 32, 42, 0.68);
      backdrop-filter: blur(44px) saturate(200%);
      -webkit-backdrop-filter: blur(44px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 28px 70px rgba(0, 0, 0, 0.6);
      border-radius: 28px;
      padding: 26px;
      animation: modalGlass 0.32s var(--spring);
    }

    /* Уведомление в стиле Apple Dynamic Island / Pill */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 30, 40, 0.78);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 14px 36px rgba(0, 0, 0, 0.45);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      z-index: 200;
      animation: toastDrop 0.35s var(--spring);
    }

    @keyframes toastDrop {
      from { opacity: 0; transform: translate(-50%, -18px) scale(0.92); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    /* Кастомный тонкий скроллбар */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 99px; }
  </style>
</head>
<body>

  <!-- Живой фон с размытыми световыми сферами -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- 0. РЕГИСТРАЦИЯ ПРОФИЛЯ -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="auth-logo">TC</div>
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Tomocord</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.45;">
        Прямое P2P-соединение без серверов. Выбери имя и цвет профиля для начала.
      </p>

      <label style="font-size: 12px; font-weight: 500; color: var(--text-muted);">Никнейм</label>
      <input type="text" id="regNick" class="glass-input" placeholder="Введи никнейм..." maxlength="20">

      <label style="font-size: 12px; font-weight: 500; color: var(--text-muted);">Оттенок профиля</label>
      <div class="color-row" id="colorPicker">
        <div class="color-dot selected" style="background: #0a84ff;" data-color="#0a84ff"></div>
        <div class="color-dot" style="background: #30d158;" data-color="#30d158"></div>
        <div class="color-dot" style="background: #bf5af2;" data-color="#bf5af2"></div>
        <div class="color-dot" style="background: #ff9f0a;" data-color="#ff9f0a"></div>
        <div class="color-dot" style="background: #ff375f;" data-color="#ff375f"></div>
      </div>

      <button class="btn-apple" onclick="completeRegister()">Продолжить</button>
    </div>
  </div>

  <!-- МОДАЛКА СЕРВЕРОВ / ЛС -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- 1. КОЛОНКА СЕРВЕРОВ И ЛС -->
  <aside class="servers-bar liquid-panel" id="serversBar"></aside>

  <!-- 2. КОЛОНКА КАНАЛОВ -->
  <aside class="channels-bar liquid-panel">
    <div>
      <div class="server-header">
        <span id="serverHeader" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Сообщения</span>
        <button class="code-pill" id="copyCodeBtn" onclick="copyCurrentCode()" title="Скопировать код">ID...</button>
      </div>
      <div class="channels-list" id="channelsList"></div>
    </div>

    <div class="user-panel">
      <!-- САУНДПАД -->
      <div class="soundpad-bar" id="soundpadBar">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 11px; font-weight: 600; color: var(--text-muted);">🎛️ САУНДПАД</span>
          <span style="font-size: 10px; color: var(--apple-blue);">В эфир</span>
        </div>
        <div class="soundpad-grid">
          <button class="pad-btn" onclick="triggerSoundpad('airhorn')">📯 Горн</button>
          <button class="pad-btn" onclick="triggerSoundpad('bruh')">🗿 Bruh</button>
          <button class="pad-btn" onclick="triggerSoundpad('boom')">💥 Boom</button>
          <button class="pad-btn" onclick="triggerSoundpad('coin')">🪙 Монета</button>
          <button class="pad-btn" onclick="triggerSoundpad('alert')">🚨 Сигнал</button>
          <button class="pad-btn" onclick="triggerSoundpad('win')">🎉 Победа</button>
        </div>
      </div>

      <!-- СТАТУС ГОЛОСОВОГО КАНАЛА / ЗВОНКА -->
      <div class="voice-status" id="voiceStatus">
        <div>
          <div class="voice-badge">● Голос активен</div>
          <div class="voice-sub" id="voiceSubText">WebRTC P2P</div>
        </div>
        <button class="icon-btn danger" onclick="leaveVoice()" title="Завершить">✕</button>
      </div>

      <!-- ПРОФИЛЬ -->
      <div class="profile-row">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
          <div class="avatar" id="myAvatar">U<span class="status-dot"></span></div>
          <div style="min-width: 0;">
            <div id="myName" style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">user</div>
            <div id="p2pStatus" style="font-size: 11px; color: var(--apple-green);">В сети</div>
          </div>
        </div>
        <div style="display: flex; gap: 2px;">
          <button class="icon-btn" id="padToggleBtn" onclick="toggleSoundpad()" title="Саундпад">🎛️</button>
          <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Микрофон">🎙️</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 3. ОКНО ЧАТА -->
  <main class="chat-area liquid-panel">
    <header class="chat-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="chatPrefix" style="color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 17px;">@</span>
        <span id="chatTitle">Сообщения</span>
      </div>
      <div id="headerActions"></div>
    </header>

    <div class="messages-box" id="messagesBox"></div>

    <div class="input-wrap">
      <form class="input-form" onsubmit="sendMessage(event)">
        <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off">
        <button type="submit" class="send-btn">Отправить</button>
      </form>
    </div>
  </main>

  <div id="remoteAudios"></div>

  <script>
    // ==========================================
    // 1. ХРАНИЛИЩЕ И СОСТОЯНИЕ
    // ==========================================
    let selectedColor = '#0a84ff';
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.onclick = () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        selectedColor = dot.dataset.color;
      };
    });

    const state = {
      user: null,
      peer: null,
      conns: {},
      mediaCalls: {},
      mode: 'dm',
      activeServerId: null,
      activeChannelId: 'welcome',
      dms: JSON.parse(localStorage.getItem('tc_dms') || '[]'),
      servers: JSON.parse(localStorage.getItem('tc_servers') || '[]'),
      messages: JSON.parse(localStorage.getItem('tc_msgs') || '{}'),
      voiceRoom: null,
      voiceUsers: {},
      muted: false,
      audioCtx: null,
      mixedDest: null,
      localStream: null
    };

    function saveLocal() {
      localStorage.setItem('tc_dms', JSON.stringify(state.dms));
      localStorage.setItem('tc_servers', JSON.stringify(state.servers));
      localStorage.setItem('tc_msgs', JSON.stringify(state.messages));
    }

    function showToast(text) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -12px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 250);
      }, 2500);
    }

    const savedUser = localStorage.getItem('tc_user');
    if (savedUser) {
      state.user = JSON.parse(savedUser);
      document.getElementById('authOverlay').classList.add('hidden');
      initApp();
    }

    function completeRegister() {
      const name = document.getElementById('regNick').value.trim() || 'user';
      const rand = Math.random().toString(36).substring(2, 6);
      const cleanName = name.toLowerCase().replace(/[^a-z0-9]/gi, '') || 'user';
      state.user = {
        id: `tc-${cleanName}-${rand}`,
        name,
        color: selectedColor
      };
      localStorage.setItem('tc_user', JSON.stringify(state.user));
      document.getElementById('authOverlay').classList.add('hidden');
      initApp();
    }

    // ==========================================
    // 2. ИНИЦИАЛИЗАЦИЯ PEERJS (P2P)
    // ==========================================
    function initApp() {
      document.getElementById('myName').textContent = state.user.name;
      const av = document.getElementById('myAvatar');
      av.style.background = state.user.color;
      av.childNodes[0].textContent = state.user.name[0].toUpperCase();

      state.peer = new Peer(state.user.id, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      state.peer.on('open', () => {
        document.getElementById('p2pStatus').textContent = 'P2P в сети';
        render();
        state.dms.forEach(dm => connectToPeer(dm.peerId));
        state.servers.forEach(srv => {
          if (srv.hostPeerId !== state.user.id) connectToPeer(srv.hostPeerId);
        });
      });

      state.peer.on('connection', conn => setupConnection(conn));

      state.peer.on('call', async call => {
        const stream = await getMixedMicStream();
        call.answer(stream);
        handleMediaCall(call);
        showToast('📞 Входящий голосовой поток');
      });

      state.peer.on('error', err => {
        if (err.type === 'peer-unavailable') showToast('Пользователь сейчас не в сети');
      });

      render();
    }

    function connectToPeer(peerId) {
      if (!peerId || peerId === state.user.id || state.conns[peerId]?.open) return state.conns[peerId];
      const conn = state.peer.connect(peerId, { reliable: true });
      setupConnection(conn);
      return conn;
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        state.conns[conn.peer] = conn;
        conn.send({ type: 'hello', user: state.user });
        render();
      });

      conn.on('data', data => handleIncomingData(conn, data));

      conn.on('close', () => {
        delete state.conns[conn.peer];
        render();
      });
    }

    function handleIncomingData(conn, data) {
      if (data.type === 'hello') {
        const exists = state.dms.find(d => d.peerId === data.user.id);
        if (!exists) {
          state.dms.push({ peerId: data.user.id, name: data.user.name, color: data.user.color });
        } else {
          exists.name = data.user.name;
          exists.color = data.user.color;
        }
        saveLocal();
        render();
      }

      if (data.type === 'dm_msg') {
        const chatKey = 'dm_' + data.from.id;
        if (!state.messages[chatKey]) state.messages[chatKey] = [];
        state.messages[chatKey].push({
          author: data.from.name,
          color: data.from.color,
          time: data.time,
          text: data.text
        });
        saveLocal();
        if (state.mode === 'dm' && state.activeChannelId === chatKey) render();
        else showToast(`💬 ${data.from.name}: ${data.text.slice(0, 28)}`);
      }

      if (data.type === 'srv_msg') {
        if (!state.messages[data.channelId]) state.messages[data.channelId] = [];
        state.messages[data.channelId].push(data.msg);
        saveLocal();
        const srv = state.servers.find(s => s.id === data.serverId);
        if (srv && srv.hostPeerId === state.user.id) {
          broadcastToServer(srv, data, conn.peer);
        }
        if (state.activeChannelId === data.channelId) render();
      }

      if (data.type === 'srv_sync_req') {
        const srv = state.servers.find(s => s.id === data.serverId);
        if (srv) conn.send({ type: 'srv_sync_res', server: srv });
      }

      if (data.type === 'srv_sync_res') {
        if (!state.servers.find(s => s.id === data.server.id)) {
          state.servers.push(data.server);
          saveLocal();
        }
        state.mode = 'server';
        state.activeServerId = data.server.id;
        state.activeChannelId = data.server.channels[0].id;
        render();
        showToast(`✨ Вход на сервер «${data.server.name}»`);
      }

      if (data.type === 'voice_join') {
        if (!state.voiceUsers[data.roomId]) state.voiceUsers[data.roomId] = [];
        if (!state.voiceUsers[data.roomId].find(u => u.id === data.user.id)) {
          state.voiceUsers[data.roomId].push(data.user);
        }
        if (state.voiceRoom && state.voiceRoom.id === data.roomId) {
          callPeerAudio(data.user.id);
        }
        render();
      }

      if (data.type === 'voice_leave') {
        if (state.voiceUsers[data.roomId]) {
          state.voiceUsers[data.roomId] = state.voiceUsers[data.roomId].filter(u => u.id !== data.userId);
        }
        render();
      }

      if (data.type === 'soundpad') {
        playSynthSound(data.sound, false);
      }
    }

    function broadcastToServer(srv, payload, excludePeerId = null) {
      Object.values(state.conns).forEach(c => {
        if (c.open && c.peer !== excludePeerId) c.send(payload);
      });
    }

    // ==========================================
    // 3. ЗВОНКИ (WEBRTC) + САУНДПАД
    // ==========================================
    async function getMixedMicStream() {
      if (state.localStream) return state.localStream;
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.mixedDest = state.audioCtx.createMediaStreamDestination();

      try {
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        const micSource = state.audioCtx.createMediaStreamSource(mic);
        micSource.connect(state.mixedDest);
      } catch (e) {
        showToast('⚠️ Микрофон недоступен — активен приём и саундпад');
      }

      state.localStream = state.mixedDest.stream;
      return state.localStream;
    }

    async function callPeerAudio(peerId) {
      if (state.mediaCalls[peerId]) return;
      const stream = await getMixedMicStream();
      const call = state.peer.call(peerId, stream);
      if (call) handleMediaCall(call);
    }

    function handleMediaCall(call) {
      state.mediaCalls[call.peer] = call;
      call.on('stream', remoteStream => {
        let audio = document.getElementById('audio_' + call.peer);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = 'audio_' + call.peer;
          audio.autoplay = true;
          document.getElementById('remoteAudios').appendChild(audio);
        }
        audio.srcObject = remoteStream;
      });
      call.on('close', () => {
        delete state.mediaCalls[call.peer];
        document.getElementById('audio_' + call.peer)?.remove();
      });
    }

    async function joinVoice(roomId, label, targetPeerId = null) {
      if (state.voiceRoom) leaveVoice();
      await getMixedMicStream();

      state.voiceRoom = { id: roomId, label };
      if (!state.voiceUsers[roomId]) state.voiceUsers[roomId] = [];
      state.voiceUsers[roomId].push(state.user);

      document.getElementById('voiceSubText').textContent = `${label} • WebRTC`;
      document.getElementById('voiceStatus').classList.add('connected');

      if (targetPeerId) {
        const conn = connectToPeer(targetPeerId);
        setTimeout(() => {
          conn?.send({ type: 'voice_join', roomId, user: state.user });
          callPeerAudio(targetPeerId);
        }, 400);
      } else {
        Object.values(state.conns).forEach(c => {
          if (c.open) c.send({ type: 'voice_join', roomId, user: state.user });
        });
      }
      render();
    }

    function leaveVoice() {
      if (!state.voiceRoom) return;
      const roomId = state.voiceRoom.id;
      if (state.voiceUsers[roomId]) {
        state.voiceUsers[roomId] = state.voiceUsers[roomId].filter(u => u.id !== state.user.id);
      }
      Object.values(state.conns).forEach(c => {
        if (c.open) c.send({ type: 'voice_leave', roomId, userId: state.user.id });
      });
      Object.values(state.mediaCalls).forEach(call => call.close());
      state.mediaCalls = {};
      state.voiceRoom = null;
      document.getElementById('voiceStatus').classList.remove('connected');
      render();
    }

    function toggleMute() {
      state.muted = !state.muted;
      if (state.localStream) {
        state.localStream.getAudioTracks().forEach(t => t.enabled = !state.muted);
      }
      const btn = document.getElementById('muteBtn');
      btn.textContent = state.muted ? '🔇' : '🎙️';
      btn.classList.toggle('danger', state.muted);
    }

    function toggleSoundpad() {
      document.getElementById('soundpadBar').classList.toggle('open');
      document.getElementById('padToggleBtn').classList.toggle('active');
    }

    function triggerSoundpad(sound) {
      playSynthSound(sound, true);
      Object.values(state.conns).forEach(c => {
        if (c.open) c.send({ type: 'soundpad', sound });
      });
    }

    function playSynthSound(type, sendToMix) {
      const ctx = state.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);
      if (sendToMix && state.mixedDest && state.audioCtx === ctx) {
        gain.connect(state.mixedDest);
      }

      if (type === 'airhorn') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(587, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (type === 'bruh') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.45);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'boom') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.6);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'coin') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(987, now);
        osc.frequency.setValueAtTime(1318, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'alert') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.linearRampToValueAtTime(980, now + 0.2);
        osc.frequency.linearRampToValueAtTime(750, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.1);
        osc.frequency.setValueAtTime(784, now + 0.2);
        osc.frequency.setValueAtTime(1046, now + 0.3);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      }
    }

    // ==========================================
    // 4. МОДАЛКИ И ОТПРАВКА СООБЩЕНИЙ
    // ==========================================
    function openAddDmModal() {
      document.getElementById('modalBox').innerHTML = `
        <h3 style="font-size: 19px; font-weight: 700; margin-bottom: 6px;">Новый диалог</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Вставь P2P ID собеседника (например, <code style="color:var(--apple-blue)">tc-user-9a2b</code>):</p>
        <input id="dmTargetId" class="glass-input" placeholder="tc-...">
        <input id="dmTargetName" class="glass-input" placeholder="Имя (необязательно)">
        <button class="btn-apple" onclick="addDmFriend()">Открыть чат</button>
      `;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function addDmFriend() {
      const peerId = document.getElementById('dmTargetId').value.trim();
      const name = document.getElementById('dmTargetName').value.trim() || peerId;
      if (!peerId) return;

      if (!state.dms.find(d => d.peerId === peerId)) {
        state.dms.push({ peerId, name, color: '#30d158' });
        saveLocal();
      }
      connectToPeer(peerId);
      state.mode = 'dm';
      state.activeChannelId = 'dm_' + peerId;
      closeModal();
      render();
    }

    function openServerModal() {
      document.getElementById('modalBox').innerHTML = `
        <h3 style="font-size: 19px; font-weight: 700; margin-bottom: 14px;">Серверы</h3>
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Создать новое пространство:</div>
        <input id="newSrvName" class="glass-input" placeholder="Название сервера">
        <button class="btn-apple" onclick="createNewServer()">Создать</button>

        <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0;"></div>

        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Присоединиться по коду:</div>
        <input id="joinSrvCode" class="glass-input" placeholder="hostId::srvId">
        <button class="btn-glass-secondary" onclick="joinExistingServer()">Войти по коду</button>
      `;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function createNewServer() {
      const name = document.getElementById('newSrvName').value.trim();
      if (!name) return;
      const srvId = 'srv_' + Math.random().toString(36).substring(2, 7);
      const srv = {
        id: srvId,
        name,
        hostPeerId: state.user.id,
        channels: [
          { id: srvId + '_c1', name: 'основной', type: 'text' },
          { id: srvId + '_c2', name: 'обсуждения', type: 'text' },
          { id: srvId + '_v1', name: 'Голосовая', type: 'voice' }
        ]
      };
      state.servers.push(srv);
      saveLocal();
      state.mode = 'server';
      state.activeServerId = srv.id;
      state.activeChannelId = srv.channels[0].id;
      closeModal();
      render();
    }

    function joinExistingServer() {
      const raw = document.getElementById('joinSrvCode').value.trim();
      const [hostPeerId, serverId] = raw.split('::');
      if (!hostPeerId || !serverId) {
        showToast('Неверный формат кода');
        return;
      }
      const conn = connectToPeer(hostPeerId);
      setTimeout(() => {
        conn?.send({ type: 'srv_sync_req', serverId });
      }, 500);
      closeModal();
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function copyCurrentCode() {
      if (state.mode === 'dm') {
        navigator.clipboard.writeText(state.user.id);
        showToast(`📋 ID скопирован: ${state.user.id}`);
      } else {
        const srv = state.servers.find(s => s.id === state.activeServerId);
        const code = `${srv.hostPeerId}::${srv.id}`;
        navigator.clipboard.writeText(code);
        showToast('📋 Код сервера скопирован');
      }
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const msg = { author: state.user.name, color: state.user.color, time, text };

      if (!state.messages[state.activeChannelId]) state.messages[state.activeChannelId] = [];
      state.messages[state.activeChannelId].push(msg);
      saveLocal();

      if (state.mode === 'dm' && state.activeChannelId.startsWith('dm_')) {
        const targetPeerId = state.activeChannelId.replace('dm_', '');
        const conn = connectToPeer(targetPeerId);
        setTimeout(() => {
          conn?.send({ type: 'dm_msg', from: state.user, time, text });
        }, 200);
      } else if (state.mode === 'server') {
        const srv = state.servers.find(s => s.id === state.activeServerId);
        broadcastToServer(srv, {
          type: 'srv_msg',
          serverId: srv.id,
          channelId: state.activeChannelId,
          msg
        });
      }

      input.value = '';
      render();
    }

    // ==========================================
    // 5. РЕНДЕР ИНТЕРФЕЙСА
    // ==========================================
    function render() {
      const serversBar = document.getElementById('serversBar');
      serversBar.innerHTML = `
        <div class="server-wrap ${state.mode === 'dm' ? 'active' : ''}">
          <div class="server-pill"></div>
          <button class="server-icon" onclick="switchToDm()" title="Личные сообщения">💬</button>
        </div>
        <div class="divider"></div>
        ${state.servers.map(s => `
          <div class="server-wrap ${state.mode === 'server' && state.activeServerId === s.id ? 'active' : ''}">
            <div class="server-pill"></div>
            <button class="server-icon" onclick="switchToServer('${s.id}')" title="${s.name}">${s.name.slice(0,2).toUpperCase()}</button>
          </div>
        `).join('')}
        <button class="server-icon server-add" onclick="openServerModal()" title="Добавить сервер">+</button>
      `;

      const copyBtn = document.getElementById('copyCodeBtn');
      const headerActions = document.getElementById('headerActions');
      headerActions.innerHTML = '';

      if (state.mode === 'dm') {
        document.getElementById('serverHeader').textContent = 'Сообщения';
        copyBtn.textContent = state.user ? state.user.id : 'ID';

        document.getElementById('channelsList').innerHTML = `
          <div class="category-title">
            <span>Диалоги (P2P)</span>
            <span style="cursor:pointer; font-size:16px; color:var(--apple-blue);" onclick="openAddDmModal()" title="Новый диалог">+</span>
          </div>
          ${state.dms.length === 0 ? `<div style="padding:10px; font-size:12px; color:var(--text-muted); line-height:1.45;">Нажми <b>+</b> сверху и введи P2P ID собеседника.</div>` : ''}
          ${state.dms.map(dm => {
            const chId = 'dm_' + dm.peerId;
            const online = state.conns[dm.peerId]?.open;
            return `
              <button class="channel-btn ${state.activeChannelId === chId ? 'active' : ''}" onclick="openDmChat('${dm.peerId}')">
                <span style="display:flex; align-items:center; gap:9px;">
                  <span style="width:8px; height:8px; border-radius:50%; background:${online ? 'var(--apple-green)' : 'rgba(255,255,255,0.22)'}; box-shadow:${online ? '0 0 8px var(--apple-green)' : 'none'};"></span>
                  ${escapeHtml(dm.name)}
                </span>
              </button>
            `;
          }).join('')}
        `;

        if (state.activeChannelId.startsWith('dm_')) {
          const peerId = state.activeChannelId.replace('dm_', '');
          const dm = state.dms.find(d => d.peerId === peerId);
          document.getElementById('chatPrefix').textContent = '@';
          document.getElementById('chatTitle').textContent = dm ? dm.name : peerId;
          const roomId = [state.user.id, peerId].sort().join('_');
          headerActions.innerHTML = `<button class="call-btn" onclick="joinVoice('${roomId}', 'Звонок: ${dm?.name || peerId}', '${peerId}')">📞 Позвонить</button>`;
        } else {
          document.getElementById('chatPrefix').textContent = '✦';
          document.getElementById('chatTitle').textContent = 'Tomocord';
        }

      } else {
        const srv = state.servers.find(s => s.id === state.activeServerId);
        document.getElementById('serverHeader').textContent = srv.name;
        copyBtn.textContent = 'Инвайт';

        const textChs = srv.channels.filter(c => c.type === 'text');
        const voiceChs = srv.channels.filter(c => c.type === 'voice');

        document.getElementById('channelsList').innerHTML = `
          <div class="category-title">Текстовые каналы</div>
          ${textChs.map(c => `
            <button class="channel-btn ${state.activeChannelId === c.id ? 'active' : ''}" onclick="selectChannel('${c.id}')">
              <span><span style="font-family:'JetBrains Mono'; opacity:0.55;">#</span> ${escapeHtml(c.name)}</span>
            </button>
          `).join('')}

          <div class="category-title" style="margin-top:14px;">Голосовые каналы</div>
          ${voiceChs.map(c => {
            const isConn = state.voiceRoom?.id === c.id;
            const users = state.voiceUsers[c.id] || [];
            return `
              <button class="channel-btn ${isConn ? 'voice-active' : ''}" onclick="joinVoice('${c.id}', '${escapeHtml(c.name)}')">
                <span>🔊 ${escapeHtml(c.name)}</span>
              </button>
              ${users.map(u => `
                <div class="voice-user">
                  <div class="mini-avatar" style="background:${u.color};">${u.name[0].toUpperCase()}</div>
                  <span>${escapeHtml(u.name)}</span>
                </div>
              `).join('')}
            `;
          }).join('')}
        `;

        const activeCh = srv.channels.find(c => c.id === state.activeChannelId) || textChs[0];
        document.getElementById('chatPrefix').textContent = '#';
        document.getElementById('chatTitle').textContent = activeCh.name;
      }

      const msgs = state.messages[state.activeChannelId] || [];
      const box = document.getElementById('messagesBox');
      if (state.activeChannelId === 'welcome') {
        box.innerHTML = `
          <div style="margin:auto; text-align:center; max-width:380px; color:var(--text-muted); animation: msgAppear 0.4s var(--spring);">
            <div style="font-size:40px; margin-bottom:12px;"></div>
            <h3 style="color:var(--text-main); font-size:18px; margin-bottom:8px;">Твой ID: <code style="color:var(--apple-blue); background:rgba(10,132,255,0.12); padding:3px 8px; border-radius:8px;">${state.user?.id || ''}</code></h3>
            <p style="font-size:13px; line-height:1.55;">Нажми на свой ID слева вверху, чтобы скопировать и отправить собеседнику. Все звонки и сообщения идут напрямую по P2P.</p>
          </div>
        `;
      } else {
        box.innerHTML = msgs.map(m => `
          <div class="msg">
            <div class="avatar" style="background:${m.color};">${m.author[0].toUpperCase()}</div>
            <div>
              <div>
                <span class="msg-author">${escapeHtml(m.author)}</span>
                <span class="msg-time">${m.time}</span>
              </div>
              <div class="msg-text">${escapeHtml(m.text)}</div>
            </div>
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      }
    }

    function switchToDm() {
      state.mode = 'dm';
      state.activeChannelId = state.dms[0] ? 'dm_' + state.dms[0].peerId : 'welcome';
      render();
    }

    function openDmChat(peerId) {
      state.mode = 'dm';
      state.activeChannelId = 'dm_' + peerId;
      connectToPeer(peerId);
      render();
    }

    function switchToServer(srvId) {
      state.mode = 'server';
      state.activeServerId = srvId;
      const srv = state.servers.find(s => s.id === srvId);
      state.activeChannelId = srv.channels[0].id;
      render();
    }

    function selectChannel(chId) {
      state.activeChannelId = chId;
      render();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
