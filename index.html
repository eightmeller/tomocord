<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tomocord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-servers: #0f1014;
      --bg-channels: #16181e;
      --bg-chat: #1c1e26;
      --bg-input: #252832;
      --bg-hover: #2a2d38;
      --bg-active: #323644;
      --border: #2a2d37;
      --text-main: #f2f4f8;
      --text-muted: #9398a6;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --green: #23a55a;
      --green-soft: rgba(35, 165, 90, 0.16);
      --red: #f23f43;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-chat);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      user-select: none;
    }

    /* Экран создания профиля */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-servers);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .auth-overlay.hidden { display: none; }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-channels);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .auth-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text-main);
      font-size: 14px;
      margin-top: 6px;
      margin-bottom: 14px;
      outline: none;
    }

    .input-field:focus { border-color: var(--accent); }

    .color-row {
      display: flex;
      gap: 10px;
      margin: 8px 0 18px;
    }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-dot.selected {
      border-color: #fff;
      transform: scale(1.1);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Обёртка навигации (для адаптива на мобильных) */
    .nav-drawer {
      display: flex;
      height: 100%;
      flex-shrink: 0;
      z-index: 40;
    }

    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 35;
    }

    /* 1. Колонка серверов */
    .servers-bar {
      width: 68px;
      background: var(--bg-servers);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      overflow-y: auto;
    }

    .server-wrap {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .server-pill {
      position: absolute;
      left: 0;
      width: 4px;
      height: 0;
      background: #fff;
      border-radius: 0 4px 4px 0;
      transition: height 0.15s ease;
    }

    .server-wrap.active .server-pill { height: 32px; }

    .server-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--bg-input);
      color: var(--text-muted);
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .server-icon:hover, .server-wrap.active .server-icon {
      background: var(--accent);
      color: #fff;
    }

    .server-add {
      color: var(--green);
      font-size: 20px;
    }

    .server-add:hover {
      background: var(--green);
      color: #fff;
    }

    .divider {
      width: 28px;
      height: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* 2. Колонка каналов */
    .channels-bar {
      width: 240px;
      background: var(--bg-channels);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .server-header {
      height: 52px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 15px;
      gap: 8px;
    }

    .code-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--bg-input);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .code-pill:hover { border-color: var(--accent); }

    .channels-list {
      padding: 10px 8px;
      flex: 1;
      overflow-y: auto;
    }

    .category-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      padding: 8px 8px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2px;
      text-align: left;
    }

    .channel-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .channel-btn.active {
      background: var(--bg-active);
      color: #fff;
    }

    .channel-btn.voice-active {
      background: var(--green-soft);
      color: var(--green);
    }

    .voice-user {
      padding: 4px 10px 6px 26px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-main);
    }

    .mini-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    /* Нижняя панель + Саундпад */
    .user-panel {
      background: #111318;
      border-top: 1px solid var(--border);
    }

    .soundpad-bar {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .soundpad-bar.open { display: flex; }

    .soundpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .pad-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }

    .pad-btn:active {
      background: var(--accent);
      color: #fff;
    }

    .voice-status {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    .voice-status.connected { display: flex; }

    .voice-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }

    .voice-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .profile-row {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      position: relative;
      flex-shrink: 0;
    }

    .status-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid #111318;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: #fff;
    }

    .icon-btn.active {
      background: var(--bg-active);
      color: #fff;
    }

    .icon-btn.danger { color: var(--red); }

    /* 3. Окно чата */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      min-width: 0;
    }

    .chat-header {
      height: 52px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
      gap: 8px;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .call-btn {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: text;
    }

    .msg {
      display: flex;
      gap: 10px;
      padding: 4px 6px;
      border-radius: 8px;
    }

    .msg:hover { background: rgba(255, 255, 255, 0.02); }

    .msg-author { font-weight: 600; font-size: 14px; }
    .msg-time { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-left: 6px; }
    .msg-text { font-size: 14px; line-height: 1.45; color: #e2e5ec; margin-top: 2px; word-break: break-word; }

    .input-wrap { padding: 0 14px 14px; }

    .input-form {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-form:focus-within { border-color: var(--accent); }

    .input-form input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Модалка */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: var(--bg-channels);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    /* Уведомление */
    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #111318;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 200;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* МОБИЛЬНАЯ ВЕРСИЯ (экраны до 768px) */
    @media (max-width: 768px) {
      .mobile-menu-btn { display: inline-flex; }

      .nav-drawer {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        max-width: 86vw;
      }

      .nav-drawer.open { transform: translateX(0); }
      .drawer-backdrop.open { display: block; }

      .channels-bar { width: 230px; }
    }
  </style>
</head>
<body>

  <!-- 0. СОЗДАНИЕ ПРОФИЛЯ -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="auth-logo">TC</div>
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">Tomocord</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
        Прямой P2P-чат и звонки без серверов. Выбери никнейм и цвет аватарки.
      </p>

      <label style="font-size: 12px; color: var(--text-muted);">Никнейм</label>
      <input type="text" id="regNick" class="input-field" placeholder="Введи никнейм..." maxlength="20">

      <label style="font-size: 12px; color: var(--text-muted);">Цвет аватарки</label>
      <div class="color-row" id="colorPicker">
        <div class="color-dot selected" style="background: #5865f2;" data-color="#5865f2"></div>
        <div class="color-dot" style="background: #23a55a;" data-color="#23a55a"></div>
        <div class="color-dot" style="background: #e67e22;" data-color="#e67e22"></div>
        <div class="color-dot" style="background: #e91e63;" data-color="#e91e63"></div>
        <div class="color-dot" style="background: #00bcd4;" data-color="#00bcd4"></div>
      </div>

      <button class="btn-primary" onclick="completeRegister()">Войти</button>
    </div>
  </div>

  <!-- МОДАЛКА -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- ЗАТЕМНЕНИЕ ДЛЯ МОБИЛЬНОГО МЕНЮ -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeMobileMenu()"></div>

  <!-- ЛЕВАЯ НАВИГАЦИЯ (СЕРВЕРЫ + КАНАЛЫ) -->
  <div class="nav-drawer" id="navDrawer">
    <aside class="servers-bar" id="serversBar"></aside>

    <aside class="channels-bar">
      <div>
        <div class="server-header">
          <span id="serverHeader" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Сообщения</span>
          <button class="code-pill" id="copyCodeBtn" onclick="copyCurrentCode()" title="Скопировать код">ID...</button>
        </div>
        <div class="channels-list" id="channelsList"></div>
      </div>

      <div class="user-panel">
        <!-- САУНДПАД -->
        <div class="soundpad-bar" id="soundpadBar">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; font-weight: 700; color: var(--text-muted);">САУНДПАД</span>
            <span style="font-size: 10px; color: var(--accent);">В эфир</span>
          </div>
          <div class="soundpad-grid">
            <button class="pad-btn" onclick="triggerSoundpad('airhorn')">📯 Горн</button>
            <button class="pad-btn" onclick="triggerSoundpad('bruh')">🗿 Bruh</button>
            <button class="pad-btn" onclick="triggerSoundpad('boom')">💥 Boom</button>
            <button class="pad-btn" onclick="triggerSoundpad('coin')">🪙 Монета</button>
            <button class="pad-btn" onclick="triggerSoundpad('alert')">🚨 Сигнал</button>
            <button class="pad-btn" onclick="triggerSoundpad('win')">🎉 Победа</button>
          </div>
        </div>

        <!-- СТАТУС ЗВОНКА -->
        <div class="voice-status" id="voiceStatus">
          <div>
            <div class="voice-badge">● Голос подключён</div>
            <div class="voice-sub" id="voiceSubText">WebRTC P2P</div>
          </div>
          <button class="icon-btn danger" onclick="leaveVoice()" title="Завершить">✕</button>
        </div>

        <!-- ПРОФИЛЬ -->
        <div class="profile-row">
          <div style="display: flex; align-items: center; gap: 9px; min-width: 0;">
            <div class="avatar" id="myAvatar">U<span class="status-dot"></span></div>
            <div style="min-width: 0;">
              <div id="myName" style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">user</div>
              <div id="p2pStatus" style="font-size: 11px; color: var(--green);">В сети</div>
            </div>
          </div>
          <div style="display: flex; gap: 2px;">
            <button class="icon-btn" id="padToggleBtn" onclick="toggleSoundpad()" title="Саундпад">🎛️</button>
            <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Микрофон">🎙️</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 3. ОКНО ЧАТА -->
  <main class="chat-area">
    <header class="chat-header">
      <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
        <button class="mobile-menu-btn" onclick="openMobileMenu()" title="Меню">☰</button>
        <span id="chatPrefix" style="color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 16px;">@</span>
        <span id="chatTitle" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Сообщения</span>
      </div>
      <div id="headerActions"></div>
    </header>

    <div class="messages-box" id="messagesBox"></div>

    <div class="input-wrap">
      <form class="input-form" onsubmit="sendMessage(event)">
        <input type="text" id="msgInput" placeholder="Написать сообщение..." autocomplete="off">
        <button type="submit" class="send-btn">Отправить</button>
      </form>
    </div>
  </main>

  <div id="remoteAudios"></div>

  <script>
    let selectedColor = '#5865f2';
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.onclick = () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        selectedColor = dot.dataset.color;
      };
    });

    const state = {
      user: null,
      peer: null,
      conns: {},
      mediaCalls: {},
      mode: 'dm',
      activeServerId: null,
      activeChannelId: 'welcome',
      dms: JSON.parse(localStorage.getItem('tc_dms') || '[]'),
      servers: JSON.parse(localStorage.getItem('tc_servers') || '[]'),
      messages: JSON.parse(localStorage.getItem('tc_msgs') || '{}'),
      voiceRoom: null,
      voiceUsers: {},
      muted: false,
      audioCtx: null,
      mixedDest: null,
      localStream: null
    };

    function saveLocal() {
      localStorage.setItem('tc_dms', JSON.stringify(state.dms));
      localStorage.setItem('tc_servers', JSON.stringify(state.servers));
      localStorage.setItem('tc_msgs', JSON.stringify(state.messages));
    }

    function openMobileMenu() {
      document.getElementById('navDrawer').classList.add('open');
      document.getElementById('drawerBackdrop').classList.add('open');
    }

    function closeMobileMenu() {
      document.getElementById('navDrawer').classList.remove('open');
      document.getElementById('drawerBackdrop').classList.remove('open');
    }

    function showToast(text) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    const savedUser = localStorage.getItem('tc_user');
    if (savedUser) {
      state.user = JSON.parse(savedUser);
      document.getElementById('authOverlay').classList.add('hidden');
      initApp();
    }

    function completeRegister() {
      const name = document.getElementById('regNick').value.trim() || 'user';
      const rand = Math.random().toString(36).substring(2, 6);
      const cleanName = name.toLowerCase().replace(/[^a-z0-9]/gi, '') || 'user';
      state.user = {
        id: `tc-${cleanName}-${rand}`,
        name,
        color: selectedColor
      };
      localStorage.setItem('tc_user', JSON.stringify(state.user));
      document.getElementById('authOverlay').classList.add('hidden');
      initApp();
    }

    function initApp() {
      document.getElementById('myName').textContent = state.user.name;
      const av = document.getElementById('myAvatar');
      av.style.background = state.user.color;
      av.childNodes[0].textContent = state.user.name[0].toUpperCase();

      state.peer = new Peer(state.user.id, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      state.peer.on('open', () => {
        document.getElementById('p2pStatus').textContent = 'P2P в сети';
        render();
        state.dms.forEach(dm => connectToPeer(dm.peerId));
        state.servers.forEach(srv => {
          if (srv.hostPeerId !== state.user.id) connectToPeer(srv.hostPeerId);
        });
      });

      state.peer.on('connection', conn => setupConnection(conn));

      state.peer.on('call', async call => {
        const stream = await getMixedMicStream();
        call.answer(stream);
        handleMediaCall(call);
        showToast('📞 Входящий голосовой поток');
      });

      state.peer.on('error', err => {
        if (err.type === 'peer-unavailable') showToast('Пользователь не в сети');
      });

      render();
    }

    function connectToPeer(peerId) {
      if (!peerId || peerId === state.user.id || state.conns[peerId]?.open) return state.conns[peerId];
      const conn = state.peer.connect(peerId, { reliable: true });
      setupConnection(conn);
      return conn;
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        state.conns[conn.peer] = conn;
        conn.send({ type: 'hello', user: state.user });
        render();
      });

      conn.on('data', data => handleIncomingData(conn, data));

      conn.on('close', () => {
        delete state.conns[conn.peer];
        render();
      });
    }

    function handleIncomingData(conn, data) {
      if (data.type === 'hello') {
        const exists = state.dms.find(d => d.peerId === data.user.id);
        if (!exists) {
          state.dms.push({ peerId: data.user.id, name: data.user.name, color: data.user.color });
        } else {
          exists.name = data.user.name;
          exists.color = data.user.color;
        }
        saveLocal();
        render();
      }

      if (data.type === 'dm_msg') {
        const chatKey = 'dm_' + data.from.id;
        if (!state.messages[chatKey]) state.messages[chatKey] = [];
        state.messages[chatKey].push({
          author: data.from.name,
          color: data.from.color,
          time: data.time,
          text: data.text
        });
        saveLocal();
        if (state.mode === 'dm' && state.activeChannelId === chatKey) render();
        else showToast(`💬 ${data.from.name}: ${data.text.slice(0, 26)}`);
      }

      if (data.type === 'srv_msg') {
        if (!state.messages[data.channelId]) state.messages[data.channelId] = [];
        state.messages[data.channelId].push(data.msg);
        saveLocal();
        const srv = state.servers.find(s => s.id === data.serverId);
        if (srv && srv.hostPeerId === state.user.id) {
          broadcastToServer(srv, data, conn.peer);
        }
        if (state.activeChannelId === data.channelId) render();
      }

      if (data.type === 'srv_sync_req') {
        const srv = state.servers.find(s => s.id === data.serverId);
        if (srv) conn.send({ type: 'srv_sync_res', server: srv });
      }

      if (data.type === 'srv_sync_res') {
        if (!state.servers.find(s => s.id === data.server.id)) {
          state.servers.push(data.server);
          saveLocal();
        }
        state.mode = 'server';
        state.activeServerId = data.server.id;
        state.activeChannelId = data.server.channels[0].id;
        render();
        showToast(`Вход на сервер «${data.server.name}»`);
      }

      if (data.type === 'voice_join') {
        if (!state.voiceUsers[data.roomId]) state.voiceUsers[data.roomId] = [];
        if (!state.voiceUsers[data.roomId].find(u => u.id === data.user.id)) {
          state.voiceUsers[data.roomId].push(data.user);
        }
        if (state.voiceRoom && state.voiceRoom.id === data.roomId) {
          callPeerAudio(data.user.id);
        }
        render();
      }

      if (data.type === 'voice_leave') {
        if (state.voiceUsers[data.roomId]) {
          state.voiceUsers[data.roomId] = state.voiceUsers[data.roomId].filter(u => u.id !== data.userId);
        }
        render();
      }

      if (data.type === 'soundpad') {
        playSynthSound(data.sound, false);
      }
    }

    function broadcastToServer(srv, payload, excludePeerId = null) {
      Object.values(state.conns).forEach(c => {
        if (c.open && c.peer !== excludePeerId) c.send(payload);
      });
    }

    async function getMixedMicStream() {
      if (state.localStream) return state.localStream;
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.mixedDest = state.audioCtx.createMediaStreamDestination();

      try {
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        const micSource = state.audioCtx.createMediaStreamSource(mic);
        micSource.connect(state.mixedDest);
      } catch (e) {
        showToast('⚠️ Микрофон недоступен');
      }

      state.localStream = state.mixedDest.stream;
      return state.localStream;
    }

    async function callPeerAudio(peerId) {
      if (state.mediaCalls[peerId]) return;
      const stream = await getMixedMicStream();
      const call = state.peer.call(peerId, stream);
      if (call) handleMediaCall(call);
    }

    function handleMediaCall(call) {
      state.mediaCalls[call.peer] = call;
      call.on('stream', remoteStream => {
        let audio = document.getElementById('audio_' + call.peer);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = 'audio_' + call.peer;
          audio.autoplay = true;
          document.getElementById('remoteAudios').appendChild(audio);
        }
        audio.srcObject = remoteStream;
      });
      call.on('close', () => {
        delete state.mediaCalls[call.peer];
        document.getElementById('audio_' + call.peer)?.remove();
      });
    }

    async function joinVoice(roomId, label, targetPeerId = null) {
      if (state.voiceRoom) leaveVoice();
      await getMixedMicStream();

      state.voiceRoom = { id: roomId, label };
      if (!state.voiceUsers[roomId]) state.voiceUsers[roomId] = [];
      state.voiceUsers[roomId].push(state.user);

      document.getElementById('voiceSubText').textContent = `${label} • WebRTC`;
      document.getElementById('voiceStatus').classList.add('connected');

      if (targetPeerId) {
        const conn = connectToPeer(targetPeerId);
        setTimeout(() => {
          conn?.send({ type: 'voice_join', roomId, user: state.user });
          callPeerAudio(targetPeerId);
        }, 400);
      } else {
        Object.values(state.conns).forEach(c => {
          if (c.open) c.send({ type: 'voice_join', roomId, user: state.user });
        });
      }
      render();
    }

    function leaveVoice() {
      if (!state.voiceRoom) return;
      const roomId = state.voiceRoom.id;
      if (state.voiceUsers[roomId]) {
        state.voiceUsers[roomId] = state.voiceUsers[roomId].filter(u => u.id !== state.user.id);
      }
      Object.values(state.conns).forEach(c => {
        if (c.open) c.send({ type: 'voice_leave', roomId, userId: state.user.id });
      });
      Object.values(state.mediaCalls).forEach(call => call.close());
      state.mediaCalls = {};
      state.voiceRoom = null;
      document.getElementById('voiceStatus').classList.remove('connected');
      render();
    }

    function toggleMute() {
      state.muted = !state.muted;
      if (state.localStream) {
        state.localStream.getAudioTracks().forEach(t => t.enabled = !state.muted);
      }
      const btn = document.getElementById('muteBtn');
      btn.textContent = state.muted ? '🔇' : '🎙️';
      btn.classList.toggle('danger', state.muted);
    }

    function toggleSoundpad() {
      document.getElementById('soundpadBar').classList.toggle('open');
      document.getElementById('padToggleBtn').classList.toggle('active');
    }

    function triggerSoundpad(sound) {
      playSynthSound(sound, true);
      Object.values(state.conns).forEach(c => {
        if (c.open) c.send({ type: 'soundpad', sound });
      });
    }

    function playSynthSound(type, sendToMix) {
      const ctx = state.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);
      if (sendToMix && state.mixedDest && state.audioCtx === ctx) {
        gain.connect(state.mixedDest);
      }

      if (type === 'airhorn') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(587, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (type === 'bruh') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.45);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'boom') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.6);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'coin') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(987, now);
        osc.frequency.setValueAtTime(1318, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'alert') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.linearRampToValueAtTime(980, now + 0.2);
        osc.frequency.linearRampToValueAtTime(750, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.1);
        osc.frequency.setValueAtTime(784, now + 0.2);
        osc.frequency.setValueAtTime(1046, now + 0.3);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      }
    }

    function openAddDmModal() {
      document.getElementById('modalBox').innerHTML = `
        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">Новый диалог</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px;">Вставь P2P ID собеседника:</p>
        <input id="dmTargetId" class="input-field" placeholder="tc-...">
        <input id="dmTargetName" class="input-field" placeholder="Имя (необязательно)">
        <button class="btn-primary" onclick="addDmFriend()">Открыть чат</button>
      `;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function addDmFriend() {
      const peerId = document.getElementById('dmTargetId').value.trim();
      const name = document.getElementById('dmTargetName').value.trim() || peerId;
      if (!peerId) return;

      if (!state.dms.find(d => d.peerId === peerId)) {
        state.dms.push({ peerId, name, color: '#23a55a' });
        saveLocal();
      }
      connectToPeer(peerId);
      state.mode = 'dm';
      state.activeChannelId = 'dm_' + peerId;
      closeModal();
      closeMobileMenu();
      render();
    }

    function openServerModal() {
      document.getElementById('modalBox').innerHTML = `
        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">Серверы</h3>
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Создать сервер:</div>
        <input id="newSrvName" class="input-field" placeholder="Название сервера">
        <button class="btn-primary" onclick="createNewServer()">Создать</button>

        <div style="height: 1px; background: var(--border); margin: 16px 0;"></div>

        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Войти по коду:</div>
        <input id="joinSrvCode" class="input-field" placeholder="hostId::srvId">
        <button class="btn-secondary" onclick="joinExistingServer()">Подключиться</button>
      `;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function createNewServer() {
      const name = document.getElementById('newSrvName').value.trim();
      if (!name) return;
      const srvId = 'srv_' + Math.random().toString(36).substring(2, 7);
      const srv = {
        id: srvId,
        name,
        hostPeerId: state.user.id,
        channels: [
          { id: srvId + '_c1', name: 'основной', type: 'text' },
          { id: srvId + '_c2', name: 'обсуждения', type: 'text' },
          { id: srvId + '_v1', name: 'Голосовая', type: 'voice' }
        ]
      };
      state.servers.push(srv);
      saveLocal();
      state.mode = 'server';
      state.activeServerId = srv.id;
      state.activeChannelId = srv.channels[0].id;
      closeModal();
      closeMobileMenu();
      render();
    }

    function joinExistingServer() {
      const raw = document.getElementById('joinSrvCode').value.trim();
      const [hostPeerId, serverId] = raw.split('::');
      if (!hostPeerId || !serverId) {
        showToast('Неверный формат кода');
        return;
      }
      const conn = connectToPeer(hostPeerId);
      setTimeout(() => {
        conn?.send({ type: 'srv_sync_req', serverId });
      }, 500);
      closeModal();
      closeMobileMenu();
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function copyCurrentCode() {
      if (state.mode === 'dm') {
        navigator.clipboard.writeText(state.user.id);
        showToast(`ID скопирован: ${state.user.id}`);
      } else {
        const srv = state.servers.find(s => s.id === state.activeServerId);
        const code = `${srv.hostPeerId}::${srv.id}`;
        navigator.clipboard.writeText(code);
        showToast('Код сервера скопирован');
      }
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const msg = { author: state.user.name, color: state.user.color, time, text };

      if (!state.messages[state.activeChannelId]) state.messages[state.activeChannelId] = [];
      state.messages[state.activeChannelId].push(msg);
      saveLocal();

      if (state.mode === 'dm' && state.activeChannelId.startsWith('dm_')) {
        const targetPeerId = state.activeChannelId.replace('dm_', '');
        const conn = connectToPeer(targetPeerId);
        setTimeout(() => {
          conn?.send({ type: 'dm_msg', from: state.user, time, text });
        }, 200);
      } else if (state.mode === 'server') {
        const srv = state.servers.find(s => s.id === state.activeServerId);
        broadcastToServer(srv, {
          type: 'srv_msg',
          serverId: srv.id,
          channelId: state.activeChannelId,
          msg
        });
      }

      input.value = '';
      render();
    }

    function render() {
      const serversBar = document.getElementById('serversBar');
      serversBar.innerHTML = `
        <div class="server-wrap ${state.mode === 'dm' ? 'active' : ''}">
          <div class="server-pill"></div>
          <button class="server-icon" onclick="switchToDm()" title="Личные сообщения">💬</button>
        </div>
        <div class="divider"></div>
        ${state.servers.map(s => `
          <div class="server-wrap ${state.mode === 'server' && state.activeServerId === s.id ? 'active' : ''}">
            <div class="server-pill"></div>
            <button class="server-icon" onclick="switchToServer('${s.id}')" title="${s.name}">${s.name.slice(0,2).toUpperCase()}</button>
          </div>
        `).join('')}
        <button class="server-icon server-add" onclick="openServerModal()" title="Добавить сервер">+</button>
      `;

      const copyBtn = document.getElementById('copyCodeBtn');
      const headerActions = document.getElementById('headerActions');
      headerActions.innerHTML = '';

      if (state.mode === 'dm') {
        document.getElementById('serverHeader').textContent = 'Сообщения';
        copyBtn.textContent = state.user ? state.user.id : 'ID';

        document.getElementById('channelsList').innerHTML = `
          <div class="category-title">
            <span>Диалоги</span>
            <span style="cursor:pointer; font-size:16px; color:var(--accent);" onclick="openAddDmModal()" title="Новый диалог">+</span>
          </div>
          ${state.dms.length === 0 ? `<div style="padding:10px; font-size:12px; color:var(--text-muted); line-height:1.45;">Нажми <b>+</b> сверху и введи P2P ID собеседника.</div>` : ''}
          ${state.dms.map(dm => {
            const chId = 'dm_' + dm.peerId;
            const online = state.conns[dm.peerId]?.open;
            return `
              <button class="channel-btn ${state.activeChannelId === chId ? 'active' : ''}" onclick="openDmChat('${dm.peerId}')">
                <span style="display:flex; align-items:center; gap:8px;">
                  <span style="width:8px; height:8px; border-radius:50%; background:${online ? 'var(--green)' : '#555'};"></span>
                  ${escapeHtml(dm.name)}
                </span>
              </button>
            `;
          }).join('')}
        `;

        if (state.activeChannelId.startsWith('dm_')) {
          const peerId = state.activeChannelId.replace('dm_', '');
          const dm = state.dms.find(d => d.peerId === peerId);
          document.getElementById('chatPrefix').textContent = '@';
          document.getElementById('chatTitle').textContent = dm ? dm.name : peerId;
          const roomId = [state.user.id, peerId].sort().join('_');
          headerActions.innerHTML = `<button class="call-btn" onclick="joinVoice('${roomId}', 'Звонок: ${dm?.name || peerId}', '${peerId}')">📞 Позвонить</button>`;
        } else {
          document.getElementById('chatPrefix').textContent = '#';
          document.getElementById('chatTitle').textContent = 'Tomocord';
        }

      } else {
        const srv = state.servers.find(s => s.id === state.activeServerId);
        document.getElementById('serverHeader').textContent = srv.name;
        copyBtn.textContent = 'Инвайт';

        const textChs = srv.channels.filter(c => c.type === 'text');
        const voiceChs = srv.channels.filter(c => c.type === 'voice');

        document.getElementById('channelsList').innerHTML = `
          <div class="category-title">Текстовые каналы</div>
          ${textChs.map(c => `
            <button class="channel-btn ${state.activeChannelId === c.id ? 'active' : ''}" onclick="selectChannel('${c.id}')">
              <span><span style="font-family:'JetBrains Mono'; opacity:0.6;">#</span> ${escapeHtml(c.name)}</span>
            </button>
          `).join('')}

          <div class="category-title" style="margin-top:12px;">Голосовые каналы</div>
          ${voiceChs.map(c => {
            const isConn = state.voiceRoom?.id === c.id;
            const users = state.voiceUsers[c.id] || [];
            return `
              <button class="channel-btn ${isConn ? 'voice-active' : ''}" onclick="joinVoice('${c.id}', '${escapeHtml(c.name)}')">
                <span>🔊 ${escapeHtml(c.name)}</span>
              </button>
              ${users.map(u => `
                <div class="voice-user">
                  <div class="mini-avatar" style="background:${u.color};">${u.name[0].toUpperCase()}</div>
                  <span>${escapeHtml(u.name)}</span>
                </div>
              `).join('')}
            `;
          }).join('')}
        `;

        const activeCh = srv.channels.find(c => c.id === state.activeChannelId) || textChs[0];
        document.getElementById('chatPrefix').textContent = '#';
        document.getElementById('chatTitle').textContent = activeCh.name;
      }

      const msgs = state.messages[state.activeChannelId] || [];
      const box = document.getElementById('messagesBox');
      if (state.activeChannelId === 'welcome') {
        box.innerHTML = `
          <div style="margin:auto; text-align:center; max-width:340px; color:var(--text-muted); padding: 12px;">
            <h3 style="color:var(--text-main); font-size:17px; margin-bottom:8px;">Твой ID: <code style="color:var(--accent); background:var(--bg-input); padding:3px 7px; border-radius:6px;">${state.user?.id || ''}</code></h3>
            <p style="font-size:13px; line-height:1.5;">Нажми на свой ID в меню, чтобы скопировать и отправить собеседнику. Все чаты и звонки работают напрямую по P2P.</p>
          </div>
        `;
      } else {
        box.innerHTML = msgs.map(m => `
          <div class="msg">
            <div class="avatar" style="background:${m.color};">${m.author[0].toUpperCase()}</div>
            <div>
              <div>
                <span class="msg-author">${escapeHtml(m.author)}</span>
                <span class="msg-time">${m.time}</span>
              </div>
              <div class="msg-text">${escapeHtml(m.text)}</div>
            </div>
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      }
    }

    function switchToDm() {
      state.mode = 'dm';
      state.activeChannelId = state.dms[0] ? 'dm_' + state.dms[0].peerId : 'welcome';
      render();
    }

    function openDmChat(peerId) {
      state.mode = 'dm';
      state.activeChannelId = 'dm_' + peerId;
      connectToPeer(peerId);
      closeMobileMenu();
      render();
    }

    function switchToServer(srvId) {
      state.mode = 'server';
      state.activeServerId = srvId;
      const srv = state.servers.find(s => s.id === srvId);
      state.activeChannelId = srv.channels[0].id;
      render();
    }

    function selectChannel(chId) {
      state.activeChannelId = chId;
      closeMobileMenu();
      render();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
